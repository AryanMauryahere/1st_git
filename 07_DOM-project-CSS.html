<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM projects</title>
</head>
<body>
  <p> Youtube subscribe button. </p>
  <button class="js-subs-button">
    Subscribe
  </button>

  <p>
    Amazon Shipping calculator.
  </p>
  <p> ammount under $10: $2.99</p>
  <p> ammount between $10 and $50: $5.99</p>
  <p> ammount between $50 and $100: $9.99</p>
  <p> ammount over $100: free shipping</p>

  <input placeholder="Enter ammount." class="js-ammount" type="number" min="0" step="0.01">
  <button class="calculate-button">Calculate</button>
  <p id="shipping-cost"></p>

  <style>
    .js-subs-button {
      background-color: red;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      padding: 10px 20px;
    }

    .js-subs-button:hover {
      background-color: darkred;
    }

    .calculate-button {
      background-color: blue;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .calculate-button:hover {
      background-color: darkblue;
    }
    .js-subs-button-subscribed {
      background-color: green;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    .js-subs-button-subscribed:hover {
      background-color: darkgreen;
    }

  </style>

  <script>
    const subsButton = document.querySelector('.js-subs-button');
    subsButton.addEventListener('click', function() {
      if (subsButton.textContent.trim() === 'Subscribe') {
        subsButton.textContent = 'Subscribed';
        // subsButton.classList.replace('js-subs-button', 'js-subs-button-subscribed');
      } else {
        subsButton.textContent = 'Subscribe';
      }
      subsButton.classList.toggle('js-subs-button-subscribed');
    });



    const calculateButton = document.querySelector('.calculate-button');
    const ammountInput = document.querySelector('.js-ammount');
    const shippingCost = document.getElementById('shipping-cost');
    calculateButton.addEventListener('click', function() {
      const ammount = parseFloat(ammountInput.value);
      let totalCost = 0;
      if (ammount < 10) {
        totalCost = ammount + 2.99;
        shippingCost.textContent = `total cost: $${totalCost}`;
      } else if (ammount >= 10 && ammount < 50) {
        totalCost = ammount + 5.99;
        shippingCost.textContent = `total cost: $${totalCost}`;
      } else if (ammount >= 50 && ammount < 100) {
        totalCost = ammount + 9.99;
        shippingCost.textContent = `total cost: $${totalCost}`;
      } else {
        totalCost = ammount + 0.00;
        shippingCost.textContent = `total cost: $${totalCost}`;
      }
      ammountInput.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
          calculateButton.click();
        }
      });

    });


  </script>
  
</body>
</html>
