    const object1 {
      message : 'Hello World',
    }
    const object2 = {
      message : 'Hello World',
    }
    console.log(object1 == object2); // false, because they are different objects in memory
    console.log(object1 === object2); // false, because they are different objects in memory
    const object3 = object1;
    console.log(object1 == object3); // true, because they are the same object in memory
    console.log(object1 === object3); // true, because they are the same object in memory
    console.log(object1.message == object2.message); // true, because they have the same value
    object3.message = 'Hello Universe';
    console.log(object1.message); // Hello Universe, because object3 is a reference to object1


    const object4 = {
      message : 'Hello World',
      price : 100,
    };

    const { message, price } = object4; // destructuring assignment, extracts the message property from object1 and assigns it to a variable called message
    console.log(message); // Hello Universe, because object1.message was changed to Hello Universe
    console.log(price); // 100

    // short hand property
    const object5 = {
      message,
      price,
    };
    console.log(object5);
