    const product2 = {
      name : 'Shirt',
      [`delivery-date`] : '2023-06-01',
      rating : {
        star : 4.5,
        count : 100 // nested object, an object inside an object
      },
      fun : function function1(){
        console.log('function inside object');
      }
    };
    console.log(product2);
    console.log(product2.name);
    console.log(product2['name']);
    console.log(product2['delivery-date']); // helps to avoid errors as minus sign is not allowed in dot notation
    console.log(product2.rating.star);
    console.log(product2.rating.count);
    product2.fun();
    
    //JSON - JavaScript Object Notation
    JSON.stringify(product2); // converts object to string
    console.log(JSON.stringify(product2));
    JSON.parse(JSON.stringify(product2)); // converts string to object
    console.log(JSON.parse(JSON.stringify(product2)));
